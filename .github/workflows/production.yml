name: Consulting front production

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consulting-front-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build Nuxt SSR
        env:
          NUXT_PUBLIC_API_BASE: ${{ vars.NUXT_PUBLIC_API_BASE }}
        run: |
          if [ -z "$NUXT_PUBLIC_API_BASE" ]; then
            echo "::error::Configure repository variable NUXT_PUBLIC_API_BASE (public production API URL)"
            exit 1
          fi
          npm run build
          test -f .output/server/index.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: consulting-front-ssr
          path: .output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: consulting-front-ssr
          path: .output
      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing production secret $key"
              exit 1
            fi
          done
      - name: Setup authenticated SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload release and activate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          RELEASE="${GITHUB_SHA}"
          SSH=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST")
          tar -C .output -czf /tmp/consulting-front-output.tar.gz .
          "${SSH[@]}" "mkdir -p /var/www/consulting/front/releases/$RELEASE"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes /tmp/consulting-front-output.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/var/www/consulting/front/releases/$RELEASE/output.tar.gz"
          "${SSH[@]}" "bash -s -- '$RELEASE'" <<'REMOTE'
          set -euo pipefail
          BASE=/var/www/consulting/front
          RELEASE="$1"
          NEW="$BASE/releases/$RELEASE"
          test -f "$NEW/output.tar.gz"
          tar -xzf "$NEW/output.tar.gz" -C "$NEW"
          rm "$NEW/output.tar.gz"
          test -f "$NEW/server/index.mjs"
          PREV="$(readlink "$BASE/current" || true)"
          ln -sfn "$NEW" "$BASE/current.next"
          mv -Tf "$BASE/current.next" "$BASE/current"
          if ! sudo -n /usr/local/sbin/consulting-web-deploy front; then
            if [ -n "$PREV" ]; then
              ln -sfn "$PREV" "$BASE/current.next"
              mv -Tf "$BASE/current.next" "$BASE/current"
              sudo -n /usr/local/sbin/consulting-web-deploy front || true
            fi
            exit 1
          fi
          OK=0
          for i in $(seq 1 20); do
            if curl --fail --silent --output /dev/null --max-time 3 http://127.0.0.1:3100/; then OK=1; break; fi
            sleep 2
          done
          if [ "$OK" != 1 ]; then
            echo "Healthcheck failed; reverting previous release"
            if [ -n "$PREV" ]; then
              ln -sfn "$PREV" "$BASE/current.next"
              mv -Tf "$BASE/current.next" "$BASE/current"
              sudo -n /usr/local/sbin/consulting-web-deploy front || true
            fi
            exit 1
          fi
          echo "Deployed $RELEASE"
          REMOTE
