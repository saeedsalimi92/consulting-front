name: consulting-web
services:
  front:
    image: node:24.19.0-bookworm-slim
    container_name: consulting-front
    working_dir: /app
    command: ["node", "server/index.mjs"]
    volumes:
      - ./front/current:/app:ro
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:?Set API URL}
    ports:
      - "127.0.0.1:3100:3000"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
  panel:
    image: nginx:1.27-alpine
    container_name: consulting-panel
    volumes:
      - ./panel/current/build:/usr/share/nginx/html:ro
      - ./panel/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:3200:80"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
